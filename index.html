function animateNumbers(){if(!state.motion||matchMedia('(prefers-reduced-motion: reduce)').matches)return;qsa('[data-animate-value]').forEach(el=>{const final=+el.dataset.animateValue;const type=el.dataset.format||'number';const decimals=+(el.dataset.decimals||0);let start;function tick(t){if(!el.isConnected)return;if(start==null)start=t;const progress=Math.min(1,(t-start)/650);const v=final*(.82+.18*(1-Math.pow(1-progress,3)));el.textContent=type==='money'?money(v,decimals):type==='percent'?percent(v,decimals):num(v,decimals);if(progress<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)})}
function sparkline(seed=0,good=true,lowerBetter=false){let vals=[11,13,18,14,17,17,22,25,23,29].map((v,i)=>v+Math.sin(i*1.8+seed)*3);if(lowerBetter&&good)vals.reverse();const plan=vals.map((v,i)=>v+(lowerBetter?(good?3:-3):(good?-3:3))+Math.sin(i+seed)*2);const pts=a=>a.map((y,i)=>`${i*8.1},${30-y*.64}`).join(' ');return `<svg class="sparkline" viewBox="0 0 76 27" aria-label="Мини-график: план и факт"><polyline points="${pts(plan)}" stroke="#b6a4d6" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/><polyline points="${pts(vals)}" stroke="${good?'#bf914e':'#d4867f'}" stroke-width="1.4" fill="none"/><circle cx="72.9" cy="${30-vals[9]*.64}" r="1.6" fill="${good?'#bf914e':'#d4867f'}"/></svg>`}
function metricCard(id,index=0){let m=metric(id),{v,p}=metricNumbers(m),good=metricGood(m);return `<button class="glass kpi" data-action="metric" data-id="${id}" data-tour="metric-${id}" aria-label="${m.label}: факт ${formatMetric(m,v)}, план ${formatMetric(m,p)}. Открыть подробности"><div class="kpi-top"><span class="icon-tile">${icon(m.icon)}</span><span class="kpi-name">${m.label}</span><span class="kpi-arrow">${icon('arrowUp','xs')}</span></div><div class="between gap6"><strong class="kpi-value number" data-animate-value="${v}" data-format="${m.type}" data-decimals="${m.type==='percent'?1:0}">${formatMetric(m,v)}</strong><span class="kpi-delta ${good?'green':'red'}">${icon(v>=p?'up':'down')}${metricDelta(m)}</span></div><div class="kpi-meta"><span class="kpi-plan">План <b>${formatMetric(m,p)}</b></span>${sparkline(index,good,m.good==='down')}</div><div class="kpi-owner">${icon('user')}<span>${id==='forecast'?'ИИ-аналитик бизнеса':person(m.owner).role}</span></div></button>`}
function legend(){return '<div class="legend"><span class="flex"><i class="legend-dot plan"></i>План</span><span class="flex"><i class="legend-dot"></i>Факт</span></div>'}
function graph({kind='revenue',height=205,style='line',labels=null,values=null,plans=null,suffix=' ₽',title=''}={}){const id='chart'+(++chartCounter);let xLabels=labels||['1 июн','3 июн','5 июн','7 июн','9 июн','11 июн','13 июн','15 июн','17 июн','19 июн','21 июн','23 июн','25 июн','27 июн','30 июн'];let vals=values||[420,1120,1710,2500,2920,3500,4030,5080,6240,6800,7900,8950,10050,11200,12480];let pls=plans||[372,1100,1540,2190,2700,3260,4000,4780,5590,6110,7270,8160,9260,10310,11150];let mul=kind==='revenue'?1000:1;if(!values){vals=vals.map(v=>Math.round(v*[.92,1,1.058][state.month]));pls=pls.map(v=>Math.round(v*[.95,1,1.04][state.month]));xLabels=xLabels.map(x=>x.replace('июн',['май','июн','июл'][state.month]));}const W=660,H=height,L=47,R=13,T=12,B=31,cw=W-L-R,ch=H-T-B,n=vals.length,max=Math.max(...vals,...pls)*1.12;const x=i=>L+(i+.5)*cw/n,y=v=>T+ch-(v/max*ch);const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');const area=path(vals)+` L${x(n-1)},${H-B} L${x(0)},${H-B} Z`;let grid='';for(let i=0;i<4;i++){let value=max*i/3,yp=y(value);let text=kind==='revenue'?(value>=1000?num(value/1000,1)+' млн':num(value)+' тыс.'):num(value,kind==='loss'?1:0)+(suffix==='%'?'%':'');grid+=`<line class="chart-grid" x1="${L}" x2="${W-R}" y1="${yp}" y2="${yp}"/><text class="chart-axis" x="${L-10}" y="${yp+3}" text-anchor="end">${text}</text>`}let labelsHTML=xLabels.map((l,i)=>i%Math.ceil(n/7)===0||i===n-1?`<text class="chart-axis" x="${x(i)}" y="${H-7}" text-anchor="middle">${l}</text>`:'').join('');let bars=style==='bar'?vals.map((v,i)=>{let bw=Math.min(15,cw/n*.32);return `<rect x="${x(i)-bw-1}" y="${y(pls[i])}" width="${bw}" height="${H-B-y(pls[i])}" rx="2.5" fill="#c6b6df"/><rect x="${x(i)+1}" y="${y(v)}" width="${bw}" height="${H-B-y(v)}" rx="2.5" fill="url(#${id}-bar)"/>`}).join(''):'';let hits=vals.map((v,i)=>`<rect class="chart-hit" x="${L+i*cw/n}" y="0" width="${cw/n}" height="${H-B+5}" data-chart="1" data-label="${esc(xLabels[i])}" data-plan="${esc(suffix===' ₽'?money(pls[i]*mul):num(pls[i],kind==='loss'?1:0)+suffix)}" data-fact="${esc(suffix===' ₽'?money(v*mul):num(v,kind==='loss'?1:0)+suffix)}" data-x="${x(i)}" data-y="${y(v)}" tabindex="0" aria-label="${esc(xLabels[i])}: план ${pls[i]}, факт ${v}"/>`).join('');return `<div class="chart-wrap" ${title?`aria-label="${esc(title)}"`:''}><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title||'Сравнение плана и факта по периоду'}"><defs><linearGradient id="${id}-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e2b879" stop-opacity=".26"/><stop offset="1" stop-color="#e2b879" stop-opacity="0"/></linearGradient><linearGradient id="${id}-bar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4ad75"/><stop offset="1" stop-color="#b88748"/></linearGradient></defs>${grid}${style==='bar'?bars:`<path d="${area}" fill="url(#${id}-area)"/><path class="chart-plan" d="${path(pls)}"/><path class="chart-fact" d="${path(vals)}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="#c58c45" stroke="white" stroke-width="1.3"/>`).join('')}`}${labelsHTML}${hits}<line class="chart-hover-line" x1="0" x2="0" y1="0" y2="${H-B}"/><circle class="chart-hotdot" cx="0" cy="0" r="4.5"/></svg></div>`}

function renderOverview(){const ids=state.metricSet==='key'?KEY_METRICS:OPS_METRICS;let rev=metricNumbers(metric('revenue')),eb=metricNumbers(metric('ebitda'));return `${pageHeading('ПАНЕЛЬ СОБСТВЕННИКА','Ваш бизнес под контролем','Показатели, команда и решения — в одном пространстве.',`<span class="status-pill">${icon('crown','sm')}Выручка выше плана на ${metricDelta(metric('revenue')).replace('+','')}</span>${exportButton()}<button class="btn ai" data-action="ai-review">${icon('sparkle','sm')}<span>Обзор с ИИ</span></button>`)}<div class="section-toolbar"><div class="tabs" aria-label="Набор показателей">${tabButton('Ключевые показатели','key',state.metricSet==='key','metric-set')}${tabButton('Операционный контроль','ops',state.metricSet==='ops','metric-set')}</div><div class="flex tiny faint">${legend()}<span class="faint" data-tip="Все показатели и имена в прототипе — демонстрационные">· Демо-данные</span></div></div><section class="kpi-grid" aria-label="Ключевые показатели">${ids.map(metricCard).join('')}</section><div class="dashboard-grid"><section class="panel chart-panel" data-tour="dashboard-chart"><div class="panel-head"><div><h2>Выручка — план и факт</h2><p class="panel-sub">${MONTHS[state.month]} · накопленным итогом</p></div><div class="flex gap6"><div class="tabs small">${tabButton('График','chart',state.chartMode==='chart','chart-mode')}${tabButton('Таблица','table',state.chartMode==='table','chart-mode')}</div>${state.chartMode==='chart'?`<button class="icon-button subtle" data-action="chart-style" data-tip="${state.chartStyle==='line'?'Переключить на парные столбцы':'Переключить на две линии'}" aria-label="Вид графика">${icon(state.chartStyle==='line'?'chart':'pulse','sm')}</button>`:''}</div></div>${state.chartMode==='chart'?graph({height:190,style:state.chartStyle,title:'Выручка накопленным итогом: план и факт'}):metricsTable(ids)}<div class="chart-summary"><div><p>Выручка за период</p><strong class="number">${money(rev.v)}<span class="green">${metricDelta(metric('revenue'))}</span></strong></div><div><p>Дополнительно к плану</p><strong class="number">+${money(rev.v-rev.p)}</strong></div><div><p>EBITDA за период</p><strong class="number">${money(eb.v)}<span class="green">${metricDelta(metric('ebitda'))}</span></strong></div></div></section>${renderChat()}</div><div class="insight-banner" data-tour="insight"><span class="icon-tile">${icon('sparkle')}</span><div class="grow"><h3>Хороший результат. И три точки, которым нужно ваше внимание.</h3><p>Закупочные цены, сверхурочные и датчик в ЦКТ-3. У каждого вопроса есть ответственный и следующий шаг.</p></div><button class="btn ai small" data-action="nav" data-id="deviations">Разобрать отклонения ${icon('arrow','sm')}</button></div>`}
function metricsTable(ids=KEY_METRICS){return `<div class="table-wrap"><table class="data-table compact"><thead><tr><th>Показатель</th><th class="numeric">План</th><th class="numeric">Факт</th><th class="numeric">Δ</th></tr></thead><tbody>${ids.map(id=>{let m=metric(id),{v,p}=metricNumbers(m);return `<tr class="clickable" data-action="metric" data-id="${id}"><td>${m.label}</td><td class="numeric faint">${formatMetric(m,p)}</td><td class="numeric bold">${formatMetric(m,v)}</td><td class="numeric ${metricGood(m)?'green':'red'}">${metricDelta(m)}</td></tr>`}).join('')}</tbody></table></div>`}
function renderChat(){return `<section class="ai-panel" data-tour="ai-chat"><div class="between"><div class="flex"><div class="ai-orb">${icon('robot')}</div><div><div class="ai-title">Ваш ИИ-аналитик</div><div class="ai-status"><span class="dot"></span>Рядом с вашим бизнесом</div></div></div><button class="icon-button subtle" data-action="ai-info" data-tip="Что умеет этот ассистент" aria-label="Об ассистенте">${icon('more','sm')}</button></div><div class="chat-scroll" id="chatLog" role="log" aria-live="polite">${chatMessages.length?chatMessages.map(chatMessageHTML).join(''):`<div class="chat-message"><strong>Алексей, месяц складывается хорошо.</strong><br>Выручка выше плана на ${metricDelta(metric('revenue')).replace('+','')}, EBITDA — на ${metricDelta(metric('ebitda')).replace('+','')}.<br><br>Я бы проверил <strong>закупочные цены</strong>: отклонение 4,1% при ориентире 3%. Можем сразу поставить задачу Дмитрию.<div><button class="btn ai small mt12" data-action="ai-task" data-id="purchaseVariance">${icon('plus','xs')}Поставить задачу Дмитрию</button></div><span class="chat-time">Демонстрационный обзор</span></div>`}</div><div class="chat-quick"><button data-action="chat-quick" data-text="Что требует внимания?">Что требует внимания?</button><button data-action="chat-quick" data-text="Подготовь план действий">План действий</button></div><form class="chat-input" data-form="chat"><input name="message" autocomplete="off" placeholder="Спросите о вашем бизнесе..." aria-label="Сообщение ИИ-аналитику" maxlength="1000"><button class="chat-send" aria-label="Отправить">${icon('send')}</button></form><div class="chat-disclaimer">Демо-ассистент · сценарные ответы без подключения к ИИ</div></section>`}
function chatMessageHTML(m){return `<div class="chat-message ${m.user?'user':''}">${m.html||esc(m.text)}${m.action?`<button class="btn ai small mt12" data-action="ai-task" data-id="${m.action}">${icon('plus','xs')}Создать задачу</button>`:''}<span class="chat-time">${m.user?'Вы':'ИИ-аналитик · демо'}</span></div>`}
function financeTabs(){const tabs=[['overview','Общий обзор'],['budgets','Бюджеты'],['planfact','План-факт'],['cash','ДДС'],['pnl','P&L'],['balance','Баланс'],['scenario','Сценарии']];const cur=subroute||'overview';return `<div class="section-toolbar"><div class="tabs">${tabs.map(([id,name])=>tabButton(name,id,id===cur)).join('')}</div><span class="tiny faint">Управленческий учёт · ${MONTHS[state.month]}</span></div>`}
function renderFinance(){let cur=subroute||'overview';const titles={overview:'Финансовое планирование и учёт',budgets:'Бюджеты подразделений',planfact:'План-факт по статьям',cash:'Движение денежных средств',pnl:'Прибыли и убытки',balance:'Управленческий баланс',scenario:'Сценарии и прогноз'};let heading=pageHeading('ФИНАНСЫ',titles[cur]||titles.overview,'Не просто цифры. Основание для следующего решения.',`${exportButton('finance')}<button class="btn primary" data-action="create-budget">${icon('plus','sm')}<span>Создать план</span></button>`);let content=cur==='budgets'?renderBudgets():cur==='scenario'?renderScenario():cur==='pnl'?renderPnl():cur==='cash'?renderCash():cur==='balance'?renderBalance():cur==='planfact'?`<section class="panel"><div class="panel-head"><div><h2>От общего результата — к каждой статье</h2><p class="panel-sub">Нажмите на показатель, чтобы увидеть ответственного и разбор отклонения</p></div>${legend()}</div>${metricsTable(METRICS.map(m=>m.id))}</section>`:renderFinanceOverview();return heading+financeTabs()+content}
function statCard(label,value,iconName,foot='',color='',animate=null){return `<div class="glass stat-card"><div class="stat-label">${icon(iconName,'sm')}${label}</div><div class="stat-value number ${color}" ${animate?`data-animate-value="${animate.value}" data-format="${animate.type}"`:''}>${value}</div><p class="stat-foot">${foot}</p></div>`}
function renderFinanceOverview(){let r=metricNumbers(metric('revenue')),p=metricNumbers(metric('profit')),c=metricNumbers(metric('cash'));return `<div class="finance-top">${statCard('Выручка',money(r.v),'chart',`<span class="green">${metricDelta(metric('revenue'))}</span> к плану`)}${statCard('Предварительная прибыль',money(p.v),'crown',`<span class="green">${metricDelta(metric('profit'))}</span> к плану`)}${statCard('Денежные средства',money(c.v),'wallet',`На конец периода · план ${money(c.p)}`)}${statCard('ФОТ',money(metricNumbers(metric('payroll')).v),'users',`<span class="red">${metricDelta(metric('payroll'))}</span> к бюджету · требуется разбор`)}</div><div class="finance-grid"><section class="panel"><div class="panel-head"><div><h2>Выручка в динамике</h2><p class="panel-sub">План и факт · накопленным итогом</p></div>${legend()}</div>${graph({height:230,style:'bar'})}</section><section class="panel"><div class="panel-head"><div><h2>Расходы под контролем</h2><p class="panel-sub">План и факт по основным статьям</p></div></div>${[['Продукты и сырьё',3080,3240],['Фонд оплаты труда',2500,2640],['Аренда и коммунальные',1200,1180],['Маркетинг',650,710],['Прочие расходы',890,770]].map(([name,plan,fact])=>`<div class="expense-row" data-tip="${name}: план ${money(plan*1000)}, факт ${money(fact*1000)}"><div class="expense-label"><span>${name}</span><strong class="${fact>plan?'red':'green'}">${money(fact*1000)}</strong></div><div class="dual-bars"><i style="width:${plan/3600*100}%"></i><i class="fact" style="width:${fact/3600*100}%"></i></div></div>`).join('')}<div class="mt20">${legend()}</div></section></div><div class="finance-bottom"><section class="panel"><div class="panel-head"><h2>План-факт по показателям</h2><button class="link" data-action="finance-tab" data-id="planfact">Все статьи ${icon('arrow','xs')}</button></div>${metricsTable(['revenue','profit','payroll','cash','writeoffs'])}</section><section class="panel"><div class="panel-head"><h2>Следующие платежи</h2><button class="link" data-action="finance-tab" data-id="cash">Календарь ${icon('arrow','xs')}</button></div>${cashRows()}<div class="insight-banner mt16" style="margin-bottom:0;padding:12px"><span class="purple">${icon('sparkle','sm')}</span><div class="tiny muted">В демонстрационном календаре остатка достаточно для ближайших выплат.</div></div></section></div><div class="insight-banner"><span class="icon-tile">${icon('brain')}</span><div class="grow"><h3>Прибыль растёт, но закупочные цены требуют внимания.</h3><p>Отклонение по мясу — +11,5%. Есть смысл сравнить предложения до следующего заказа.</p></div><button class="btn ai small" data-action="metric" data-id="purchaseVariance">Посмотреть разбор ${icon('arrow','xs')}</button></div>`}
function renderBudgets(){return `<div class="budget-grid" data-tour="budgets">${state.budgets.map(b=>{let usage=Math.round(b.spent/b.plan*100),bad=usage>100;return `<section class="glass budget-card"><div class="between"><span class="icon-tile">${icon('coins')}</span>${badge(b.status,bad?'red':'green')}</div><h3 class="mt16">${esc(b.name)}</h3><p class="small muted mt8">${esc(b.dept)} · ${MONTHS[state.month]}</p><div class="number">${money(b.spent)}</div><div class="between small"><span class="faint">из ${money(b.plan)}</span><span class="${bad?'red':'amber'}">${usage}%</span></div><div class="mt12">${miniProgress(usage,bad?'red':'')}</div><footer><div class="flex gap6">${avatar(b.owner)}<span class="tiny muted">${person(b.owner).name.split(' ')[0]}</span></div><button class="btn small" data-action="edit-budget" data-id="${b.id}">${icon('edit','xs')}Изменить</button></footer></section>`}).join('')}<button class="budget-new" data-action="create-budget">${icon('plus','lg')}<span>Создать новый бюджет</span><small>Подразделение, лимит и ответственный</small></button></div><div class="insight-banner"><span class="icon-tile">${icon('info')}</span><div class="grow"><h3>У каждого бюджета — свой владелец.</h3><p>Измените лимит, и план-факт по карточке пересчитается. Изменения остаются только в этом браузере.</p></div></div>`}
function renderScenario(){return `<div class="scenario-grid"><section class="panel"><div class="panel-head"><div><h2>А что, если?..</h2><p class="panel-sub">Измените предпосылки — результат пересчитается сразу</p></div><span class="icon-tile">${icon('trend')}</span></div>${[['traffic','Изменение гостевого потока',-20,30,scenario.traffic,'%'],['check','Изменение среднего чека',-15,20,scenario.check,'%'],['cost','Изменение себестоимости',-8,8,scenario.cost,'п.п.']].map(([id,label,min,max,value,unit])=>`<div class="range-block"><div class="range-label"><span>${label}</span><strong id="range-${id}-value">${value>0?'+':''}${value} ${unit}</strong></div><input type="range" min="${min}" max="${max}" step="1" value="${value}" data-range="${id}" aria-label="${label}"><div class="range-limits"><span>${min} ${unit}</span><span>Базовый сценарий</span><span>+${max} ${unit}</span></div></div>`).join('')}<div class="separator"></div><div class="tiny faint" style="line-height:1.8">Демо-модель: текущая выручка × изменение гостей × изменение чека. Дополнительная маржа учитывает переменные расходы; остальные расходы фиксированы. Это не финансовая рекомендация.</div><button class="btn mt20" data-action="reset-scenario">${icon('refresh','sm')}Вернуть базовый сценарий</button></section><section class="scenario-output" id="scenario-output">${scenarioOutput()}</section></div>`}
function scenarioOutput(){let base=metricNumbers(metric('revenue')).v, rev=base*(1+scenario.traffic/100)*(1+scenario.check/100),ebBase=metricNumbers(metric('ebitda')).v,eb=ebBase+(rev-base)*.58-rev*scenario.cost/100,margin=eb/rev*100;return `<span class="tag amber">ПРОГНОЗ · ${MONTHS[state.month===2?2:state.month+1]}</span><p class="small muted mt20">Расчётная выручка</p><div class="number">${money(rev)}</div><div class="small ${rev>=base?'green':'red'} mt8">${rev>=base?'+':''}${percent((rev/base-1)*100,1)} к базовой выручке</div><div class="scenario-item mt12"><div class="between"><span class="small muted">Расчётная EBITDA</span><strong class="number" style="font-size:23px">${money(eb)}</strong></div></div><div class="scenario-item"><div class="between"><span class="small muted">Рентабельность EBITDA</span><strong class="number" style="font-size:23px">${percent(margin,1)}</strong></div></div><div class="scenario-item"><div class="between"><span class="small muted">Изменение EBITDA</span><strong class="number ${eb>=ebBase?'green':'red'}" style="font-size:20px">${eb>=ebBase?'+':''}${money(eb-ebBase)}</strong></div></div><button class="btn primary wide mt24" data-action="save-scenario">${icon('check','sm')}Сохранить как план</button><p class="tiny faint mt12 text-center">В демонстрационный бюджет, без внешних действий</p>`}

/* interactions.js */
function toast(text,actionLabel='',action='',id=''){if(!state.notify&&!actionLabel)return;const el=document.createElement('div');el.className='toast';el.innerHTML=`${icon('checkCircle')}<span>${esc(text)}</span>${actionLabel?`<button class="toast-action" data-action="${action}" data-id="${esc(id)}">${esc(actionLabel)}</button>`:''}`;qs('#toasts').append(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(5px)';el.style.transition='opacity .3s,transform .3s';setTimeout(()=>el.remove(),350)},actionLabel?7500:4600)}
function hideTooltip(){qs('#tooltip').classList.remove('show');qsa('.chart-hover-line,.chart-hotdot').forEach(el=>el.style.opacity='0');lastHover=null}
function positionTooltip(event,el){const tip=qs('#tooltip');let x=event.clientX+14,y=event.clientY+16;const r=tip.getBoundingClientRect();if(x+r.width>window.innerWidth-12)x=window.innerWidth-r.width-12;if(y+r.height>window.innerHeight-12)y=event.clientY-r.height-13;tip.style.left=Math.max(10,x)+'px';tip.style.top=Math.max(10,y)+'px'}
function closePopover(restore=false){const old=qs('.popover');if(old){old.remove();if(restore&&popoverReturnFocus?.isConnected)popoverReturnFocus.focus({preventScroll:true})}}
function openPopover(anchor,html,width=null){closePopover();popoverReturnFocus=anchor;let p=document.createElement('div');p.className='popover';p.setAttribute('role','menu');p.innerHTML=html;if(width)p.style.width=width+'px';document.body.append(p);let r=anchor.getBoundingClientRect(),pr=p.getBoundingClientRect();p.style.top=Math.min(r.bottom+9,innerHeight-pr.height-12)+'px';p.style.left=Math.max(10,Math.min(r.left,innerWidth-pr.width-15))+'px';setTimeout(()=>qs('button',p)?.focus({preventScroll:true}),50)}
function lockScroll(){document.body.style.overflow='hidden'}
function unlockScroll(){if(!qs('.modal-overlay')&&!qs('.drawer'))document.body.style.overflow=''}
function closeModal(restore=true){const old=qs('.modal-overlay');if(old){old.remove();unlockScroll();if(restore&&modalReturnFocus?.isConnected)modalReturnFocus.focus({preventScroll:true})}}
function openModal({title,sub='',body='',footer='',wide=false,form='',id=''}){closePopover();hideTooltip();modalReturnFocus=document.activeElement;closeModal(false);const el=document.createElement('div');el.className='modal-overlay';el.dataset.action='modal-background';el.innerHTML=`<section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><div class="modal-header"><h2 id="modalTitle">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Закрыть окно">${icon('close','sm')}</button></div>${sub?`<p class="modal-sub">${sub}</p>`:'<div class="mt20"></div>'}${form?`<form data-form="${form}" ${id?`data-id="${esc(id)}"`:''}>`:''}${body}${footer?`<div class="modal-footer">${footer}</div>`:''}${form?'</form>':''}</section>`;qs('#overlays').append(el);lockScroll();setTimeout(()=>{const focus=qs('[autofocus]',el)||qs('input:not([type=hidden]),textarea,select',el)||qs('.modal',el);focus?.focus({preventScroll:true})},80)}
function closeDrawer(restore=true){const old=qs('.drawer');if(old){old.remove();qs('.drawer-shade')?.remove();drawerState=null;unlockScroll();if(restore&&drawerReturnFocus?.isConnected)drawerReturnFocus.focus({preventScroll:true})}}
function openDrawer(html,type='',id='',preserve=false){let scroll=preserve?qs('.drawer')?.scrollTop||0:0;closePopover();hideTooltip();closeModal(false);if(!preserve)drawerReturnFocus=document.activeElement;closeDrawer(false);let shade=document.createElement('div');shade.className='drawer-shade';shade.dataset.action='close-drawer';let drawer=document.createElement('aside');drawer.className='drawer';drawer.setAttribute('role','dialog');drawer.setAttribute('aria-modal','true');drawer.setAttribute('aria-label',type==='metric'?'Подробности показателя':type==='task'?'Карточка задачи':'Подробности');drawer.tabIndex=-1;drawer.innerHTML=html;qs('#overlays').append(shade,drawer);drawerState={type,id};lockScroll();drawer.scrollTop=scroll;if(!preserve)setTimeout(()=>drawer.focus({preventScroll:true}),80)}

function field(label,html,hint=''){return `<div class="field"><label>${label}</label>${html}${hint?`<p class="field-hint">${hint}</p>`:''}</div>`}
function cancelButton(){return '<button type="button" class="btn" data-action="close-modal">Отмена</button>'}
function metricDrawer(id){const m=metric(id),{v,p}=metricNumbers(m),good=metricGood(m),ow=person(m.owner);let vals=[.64,.78,.83,.95,1].map(a=>+(a*v/(m.type==='money'&&v>100000?1000:1)).toFixed(1)),plans=[.65,.77,.85,.95,1].map(a=>+(a*p/(m.type==='money'&&v>100000?1000:1)).toFixed(1));if(m.type==='percent'){vals=[v+.8,v+.4,v+.5,v+.1,v];plans=Array(5).fill(p)}return openDrawer(`${drawerHead('ПОКАЗАТЕЛЬ / '+MONTHS[state.month],m.label,m.icon)}<div class="drawer-value number">${formatMetric(m,v)}</div><div class="between"><span class="small faint">План: ${formatMetric(m,p)}</span><span class="tag ${good?'green':'red'}">${metricDelta(m)} к плану</span></div><p class="small muted mt16" style="line-height:1.8">${m.description}</p><div class="drawer-section"><div class="between"><h3>Динамика показателя</h3>${legend()}</div>${graph({kind:m.type==='money'&&v>100000?'revenue':m.type==='percent'?'loss':'units',height:215,values:vals,plans,labels:[1,7,14,21,state.month===1?30:31].map(n=>n+' '+['май','июн','июл'][state.month]),suffix:m.type==='money'?' ₽':m.type==='percent'?'%':''})}</div><div class="drawer-section"><h3>Кто отвечает за результат</h3><div class="between"><button class="table-person" data-action="person" data-id="${ow.id}" style="text-align:left">${avatar(ow.id,'md')}<span><strong>${ow.name}</strong><small>${ow.role}</small></span></button><button class="btn small" data-action="message-person" data-id="${ow.id}">${icon('message','xs')}Написать</button></div></div><div class="drawer-ai"><div class="flex purple"><span class="icon-tile purple">${icon('sparkle')}</span><h3 class="small">Комментарий ИИ-аналитика</h3></div><p>${m.comment}</p><button class="btn ai wide" data-action="ai-task" data-id="${id}">${icon('plus','sm')}Превратить рекомендацию в задачу</button><p class="tiny" style="margin-bottom:0">Предложение появится в колонке «Авторазбор от ИИ».</p></div>`, 'metric',id)}
function createAITask(id){const existing=state.tasks.find(t=>t.sourceMetric===id&&t.status!=='done');if(existing){navigate('tasks');setTimeout(()=>taskDrawer(existing.id),100);toast('Такая рекомендация уже есть в задачах');return}let m=metric(id);const titles={purchaseVariance:'Сравнить поставщиков мяса и зафиксировать цены',payroll:'Разобрать сверхурочные и скорректировать графики',beerLoss:'Закрепить регламент снижения потерь пива',revenue:'Закрепить факторы роста выручки',ebitda:'Подготовить разбор роста EBITDA',cash:'Проверить платёжный календарь на следующую неделю',forecast:'Подготовить план к сезонному росту',forecastError:'Добавить события в прогноз выручки',foodCost:'Проверить закупочные цены по ключевым продуктам',guests:'Масштабировать привлечение повторных гостей',check:'Включить лучшие рекомендации официантов в обучение',staffShare:'Сопоставить затраты на команду с загрузкой',margin:'Подготовить план повышения маржинальности'};const t={id:Date.now(),title:titles[id]||`Проверить показатель «${m.label}»`,owner:m.owner==='owner'?'olga':m.owner,status:'ai',source:'ИИ',sourceMetric:id,priority:metricGood(m)?'normal':'high',due:'2024-07-01',check:[false,false,false],description:m.comment};state.tasks.unshift(t);save();navigate('tasks');setTimeout(()=>{let card=qs(`[data-task="${t.id}"]`);if(card){card.style.boxShadow='0 0 0 2px #bd9be5,0 8px 20px #ac80dc33';setTimeout(()=>card.style.boxShadow='',2400)}},160);toast('Рекомендация стала задачей. Ответственный назначен.','Открыть','task-detail',t.id)}
function taskDrawer(id,preserve=false){const t=state.tasks.find(t=>t.id===+id);if(!t){toast('Задача не найдена');return}const comments=state.taskComments[id]||[];openDrawer(`${drawerHead(`ЗАДАЧА SG-${String(t.id).slice(-4)}`,esc(t.title))}<div class="flex wrap mt16">${badge(t.source,t.source==='ИИ'?'purple':t.source==='Регламент'?'amber':'blue')}${badge(t.priority==='high'?'Высокий приоритет':t.priority==='low'?'Низкий приоритет':'Обычный приоритет',t.priority==='high'?'red':'')}${overdue(t)?badge(`Просрочено на ${overdue(t)} дн.`,'red'):''}</div><div class="drawer-section"><div class="form-grid"><div class="field" style="margin-bottom:0"><label>Этап</label><select class="select" data-change="task-status" data-id="${t.id}">${STATUSES.map(s=>`<option value="${s.id}" ${s.id===t.status?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="field" style="margin-bottom:0"><label>Срок · демо-дата 30 июня</label><input class="input" type="date" value="${t.due}" data-change="task-due" data-id="${t.id}" aria-label="Срок задачи"></div></div><div class="field mt16" style="margin-bottom:0"><label>Ответственный</label><select class="select" data-change="task-assignee" data-id="${t.id}">${personOptions(t.owner)}</select></div></div><div class="drawer-section"><h3>Что нужно сделать</h3><p class="small muted" style="line-height:1.85">${esc(t.description)}</p></div><div class="drawer-section"><div class="between mb12"><h3 style="margin-bottom:0">Шаги к результату</h3><span class="tiny faint">${t.check.filter(Boolean).length} из ${t.check.length}</span></div><div class="checklist">${['Проверить исходные данные','Подготовить решение и материалы','Передать результат на проверку'].map((label,i)=>`<label class="check-item"><input type="checkbox" data-change="task-check" data-id="${t.id}" data-index="${i}" ${t.check[i]?'checked':''}><span>${label}</span></label>`).join('')}</div></div><div class="drawer-section"><h3>Обсуждение и история</h3><div class="activity-item">${avatar(t.owner)}<div><strong class="tiny">${person(t.owner).name}</strong><p>${t.status==='done'?'Результат принят в системе.':t.source==='ИИ'?'Назначен ответственным по предложению ИИ.':'Назначен ответственным за выполнение.'}</p><small>Демонстрационная запись</small></div></div>${comments.map(c=>`<div class="activity-item">${avatar('owner')}<div><strong class="tiny">Алексей Соколов</strong><p>${esc(c.text)}</p><small>${esc(c.time)}</small></div></div>`).join('')}<form data-form="task-comment" data-id="${t.id}" class="mt16"><textarea class="textarea" name="text" rows="2" required maxlength="1000" placeholder="Комментарий к задаче..." aria-label="Комментарий"></textarea><button class="btn small mt8" type="submit">${icon('send','xs')}Добавить комментарий</button></form></div><div class="flex mt20">${t.status==='ai'?`<button class="btn primary wide" data-action="move-task" data-id="${t.id}" data-status="todo">${icon('check','sm')}Принять к исполнению</button>`:t.status==='review'?`<button class="btn primary wide" data-action="move-task" data-id="${t.id}" data-status="done">${icon('checkCircle','sm')}Принять результат</button>`:t.status==='done'?`<button class="btn wide" data-action="move-task" data-id="${t.id}" data-status="progress">${icon('refresh','sm')}Вернуть в работу</button>`:t.status==='blocked'?`<button class="btn primary wide" data-action="move-task" data-id="${t.id}" data-status="progress">${icon('check','sm')}Разблокировать задачу</button>`:`<button class="btn primary wide" data-action="move-task" data-id="${t.id}" data-status="review">${icon('arrow','sm')}Передать на проверку</button>`}</div>`, 'task',id,preserve)}
function moveTask(id,status,fromDrag=false){const t=state.tasks.find(t=>t.id===+id);if(!t||!STATUSES.some(s=>s.id===status))return;const before=t.status;t.status=status;if(status==='done')t.check=t.check.map(()=>true);save();const wasDrawer=drawerState?.type==='task'&&+drawerState.id===+id;render();if(wasDrawer)taskDrawer(id,true);if(before!==status){toast(`«${STATUSES.find(s=>s.id===status).name}»: ${t.title}`);if(status==='done')celebrate()}}
function newTaskModal(status='todo'){openModal({title:'Новая задача',sub:'Сформулируйте результат и назначьте одного ответственного.',form:'new-task',body:`<input type="hidden" name="status" value="${status}">${field('Название задачи','<input class="input" name="title" placeholder="Например, согласовать график смен" required maxlength="140" autofocus>')}${field('Что должно получиться','<textarea class="textarea" name="description" placeholder="Опишите ожидаемый результат..." required maxlength="2000"></textarea>')}<div class="form-grid">${field('Ответственный',`<select class="select" name="owner">${personOptions('anna')}</select>`)}${field('Срок','<input type="date" class="input" name="due" value="2024-07-01" required>','Демо-дата системы: 30 июня 2024')}</div>${field('Приоритет','<select class="select" name="priority"><option value="normal">Обычный</option><option value="high">Высокий</option><option value="low">Низкий</option></select>')}`,footer:`${cancelButton()}<button class="btn primary" type="submit">${icon('plus','sm')}Создать задачу</button>`})}
function personDrawer(id){let p=person(id),tasks=state.tasks.filter(t=>t.owner===id&&t.status!=='done'),learner=getLearn(id),roles=ROLES.filter(r=>roleEmployee(r.id)===id);openDrawer(`${drawerHead('СОТРУДНИК','')}<div class="flex start">${avatar(id,'xl')}<div><h2 style="margin-top:0">${esc(p.name)}</h2><p class="small muted mt8">${esc(p.role)}</p><div class="mt12">${badge(p.dept)}</div></div></div><div class="drawer-section"><div class="detail-pair"><span>Статус</span><span class="green flex gap6"><i class="dot"></i>Работает</span></div><div class="detail-pair"><span>Должность в структуре</span><span>${roles.length?roles.map(r=>r.name).join(', '):p.role}</span></div><p class="tiny faint mt16">Демонстрационная карточка. Контактные данные не являются реальными.</p><div class="flex mt16"><button class="btn primary grow" data-action="message-person" data-id="${id}">${icon('message','sm')}Написать</button><button class="btn grow" data-action="nav" data-id="${id==='owner'?'overview':'role/'+p.position}">${icon('structure','sm')}Должность</button></div></div><div class="drawer-section"><div class="between mb12"><h3 style="margin:0">Активные задачи</h3>${badge(String(tasks.length),'amber')}</div>${tasks.slice(0,5).map(t=>`<button class="action-row" style="text-align:left;width:100%" data-action="task-detail" data-id="${t.id}"><span class="icon-tile ${overdue(t)?'red':''}">${icon('task','sm')}</span><div class="grow"><p class="small">${esc(t.title)}</p><small>${STATUSES.find(s=>s.id===t.status).name}</small></div>${icon('right','xs')}</button>`).join('')||'<p class="small faint">Нет активных задач в демонстрационном наборе.</p>'}</div>${learner?`<div class="drawer-section"><h3>Обучение по роли</h3>${COURSES.map((c,i)=>`<div class="mt12"><div class="between tiny mb12" style="margin-bottom:6px"><span>${c.name}</span><span class="${learner.approved[i]?'green':'muted'}">${learner.approved[i]?'Аттестован':learner.progress[i]+'%'}</span></div>${miniProgress(learner.progress[i],learner.approved[i]?'green':'')}</div>`).join('')}<button class="btn wide mt20" data-action="nav" data-id="learning">Открыть обучение ${icon('arrow','sm')}</button></div>`:''}`, 'person',id)}
function examModal(id,index){const l=getLearn(id),c=COURSES[+index];if(!l||l.progress[index]!==100){toast('Сначала необходимо завершить курс');return}if(l.approved[index]){toast('Экзамен уже принят');return}openModal({title:'Принять экзамен',sub:`${person(id).name} · ${c.name}`,form:'exam',body:`<input type="hidden" name="person" value="${id}"><input type="hidden" name="course" value="${index}"><div class="flex mb12"><span class="icon-tile green">${icon('graduation')}</span><div><h3>Материалы курса пройдены на 100%</h3><p class="tiny faint mt8" style="margin-top:4px">Подтвердите практическую проверку знаний.</p></div></div><div class="checklist mt20">${['Сотрудник ответил на контрольные вопросы','Продемонстрировал навык на практике','Готов применять стандарт самостоятельно'].map((t,i)=>`<label class="check-item"><input type="checkbox" name="criterion${i}" required><span>${t}</span></label>`).join('')}</div>${field('Комментарий наставника','<textarea class="textarea mt16" name="comment" placeholder="Что особенно хорошо получилось?" maxlength="1000"></textarea>','Результат сохранится в демонстрационной карточке.')}`,footer:`<button class="btn" type="button" data-action="retake-course" data-person="${id}" data-course="${index}">На доработку</button><button class="btn primary" type="submit">${icon('checkCircle','sm')}Подтвердить аттестацию</button>`})}

function meetingModal(){openModal({title:'Встреча с наставником',sub:'Елена Морозова · обучение и адаптация. Встреча сохранится только в демо.',form:'meeting',body:`${field('Тема встречи','<input class="input" name="title" value="Прогресс обучения и следующие шаги" maxlength="160" required>')}<div class="form-grid">${field('Дата','<input class="input" name="date" type="date" value="2024-07-01" required>')}${field('Время','<input class="input" name="time" type="time" value="11:00" required>')}</div>${field('Продолжительность','<select class="select" name="duration"><option>30 минут</option><option>45 минут</option><option>60 минут</option></select>')}`,footer:`${cancelButton()}<button type="submit" class="btn primary">${icon('calendar','sm')}Запланировать</button>`})}

function messageModal(id){let p=person(id),messages=state.checkNotes['messages-'+id]||[];openModal({title:esc(p.name),sub:`${p.role} · локальная демо-переписка, сообщения не отправляются во внешние каналы.`,form:'person-message',id,body:`<div class="flex mb12">${avatar(id,'md')}<span class="tag green">Демонстрационный диалог</span></div><div class="stack" style="max-height:250px;overflow:auto"><div class="mentor-message" style="margin:0"><strong>${p.name}</strong>${id==='elena'?'На связи по обучению команды. Помогу с планом адаптации, экзаменами и переаттестацией.':'Готов обсудить показатели и следующие действия по моему направлению.'}</div>${messages.map(m=>`<div class="mentor-message" style="margin:0;background:#fff7"><strong>Алексей Соколов</strong>${esc(m)}</div>`).join('')}</div>${field('Сообщение','<textarea class="textarea mt16" name="message" placeholder="Напишите сообщение..." required maxlength="1000" autofocus></textarea>')}`,footer:`${cancelButton()}<button class="btn primary" type="submit">${icon('send','sm')}Добавить в диалог</button>`})}
function budgetModal(id=null){const b=id?state.budgets.find(x=>x.id===+id):null;openModal({title:b?'Изменить бюджет':'Создать финансовый план',sub:'Бюджет появится в финансовом разделе. Данные сохраняются локально.',form:'budget',id:b?.id||'',body:`${field('Название бюджета',`<input class="input" name="name" value="${esc(b?.name||'')}" placeholder="Например, маркетинг на июль" required maxlength="120" autofocus>`)}<div class="form-grid">${field('Плановый лимит, ₽',`<input class="input" type="number" name="plan" min="1" max="1000000000" step="1" value="${b?.plan||650000}" required>`)}${field('Подразделение',`<select class="select" name="dept">${['Все подразделения','Ресторан','Пивоварня','Финансы','Маркетинг','Закупки','Персонал'].map(d=>`<option ${b?.dept===d?'selected':''}>${d}</option>`).join('')}</select>`)}</div>${field('Владелец бюджета',`<select class="select" name="owner">${personOptions(b?.owner||'olga')}</select>`)}${b?field('Фактически использовано, ₽',`<input class="input" type="number" name="spent" min="0" max="1000000000" value="${b.spent}" required>`):''}`,footer:`${cancelButton()}<button class="btn primary" type="submit">${icon('check','sm')}Сохранить план</button>`})}
function roleEditModal(id){const r=roleById(id);openModal({title:'Редактировать карточку должности',sub:r.name,form:'edit-role',id,body:`${field('Название должности',`<input class="input" value="${r.name}" readonly>`,'В этом прототипе можно уточнить цель роли.')}${field('Цель и ожидаемый результат',`<textarea class="textarea" name="goal" rows="5" maxlength="1200" required>${esc(state.checkNotes['goal-'+id]||r.goal)}</textarea>`)}`,footer:`${cancelButton()}<button class="btn primary" type="submit">Сохранить изменения</button>`})}
function reassignModal(id){let r=roleById(id),current=roleEmployee(id);openModal({title:'Новый человек. Та же сильная система.',sub:r.name,form:'reassign',id,body:`<div class="flex mb12">${avatar(current,'md')}<div><span class="tiny faint">Сейчас на должности</span><h3>${person(current).name}</h3></div></div>${field('Назначить сотрудника',`<select class="select" name="person">${PEOPLE.filter(p=>p.id!==current&&p.id!=='owner').map(p=>`<option value="${p.id}">${p.name} · ${p.dept}</option>`).join('')}</select>`)}<div class="drawer-ai" style="margin-top:0"><h3 class="small purple">Что сохранится автоматически</h3><div class="bullet-check mt12" style="font-size:11px"><div>${icon('checkCircle')}<span>Структура, показатели и материалы должности</span></div><div>${icon('checkCircle')}<span>История предыдущих назначений</span></div><div>${icon('checkCircle')}<span>Шаблон доступов и программа адаптации</span></div></div></div><label class="check-item mt16"><input type="checkbox" required checked name="confirm"><span>Передать доступы по роли и назначить обучение новому сотруднику</span></label><p class="tiny faint mt12">Изменение выполняется только внутри демо-прототипа.</p>`,footer:`${cancelButton()}<button class="btn primary" type="submit">${icon('refresh','sm')}Назначить сотрудника</button>`})}
function assignmentHistory(id){let r=roleById(id),rows=state.assignmentHistory.filter(a=>a.role===id);openModal({title:'История назначений',sub:r.name,body:`<div class="activity-item">${avatar(r.employee)}<div><h3 class="small">${person(r.employee).name}</h3><p>Исходное назначение на должность</p><small>Демонстрационная запись</small></div></div>${rows.map(a=>`<div class="activity-item">${avatar(a.to)}<div><h3 class="small">${person(a.to).name}</h3><p>Сменил(а) ${person(a.from).name}. Доступы переданы, обучение назначено.</p><small>${a.date}</small></div></div>`).join('')}`,footer:'<button class="btn primary" data-action="close-modal">Понятно</button>'})}
function assistantModal(id){let r=ROLES.find(r=>r.id===id),title=r?r.ai:id==='data'?'ИИ-контролёр качества данных':'ИИ-аналитик бизнеса';openModal({title,sub:'Цифровой помощник с понятной ролью и ответственным человеком рядом.',body:`<div class="flex mb12"><span class="ai-orb">${icon(r?.aiIcon||'sparkle')}</span><div><h3 class="purple">Анализирует. Предлагает. Помогает контролировать.</h3><p class="tiny faint mt8">В этом HTML используется сценарная демонстрация, без языковой модели.</p></div></div><div class="drawer-ai"><h3 class="small purple">Последняя рекомендация</h3><p>${id==='data'?'Проверять полноту продаж, связность справочников и расхождения по остаткам до подготовки сводки собственнику.':id==='brewery'?'Закрепить успешную практику снижения потерь пива и обновить обучение смен.':id==='hr'?'Принять готовые экзамены и запланировать переаттестацию по контролю качества.':id==='purchasing'?'Сравнить цены на мясо и тару с альтернативными поставщиками.':'Рост выручки даёт хороший результат. Проверьте закупочные цены и сверхурочные, чтобы сохранить маржинальность.'}</p></div><div class="tiny faint mt16" style="line-height:1.8">В рабочей системе ассистент будет получать данные в рамках прав доступа. Действия, затрагивающие бизнес, требуют согласования.</div>`,footer:`<button class="btn" data-action="close-modal">Закрыть</button><button class="btn ai" data-action="${id==='hr'?'nav':'ai-task'}" data-id="${id==='hr'?'learning':id==='brewery'?'beerLoss':'purchaseVariance'}">${icon('plus','sm')}${id==='hr'?'Открыть обучение':'Создать задачу из рекомендации'}</button>`})}
function documentModal(id){const docs={sop:{title:'SOP пивоварни: контроль мойки и потерь',subtitle:'Демонстрационный регламент · версия 1.0',sections:[['Назначение','Обеспечить повторяемость процесса и снизить операционные потери. Документ служит примером размещения внутренних стандартов в системе.'],['До начала работ','Сотрудник сверяет актуальную утверждённую инструкцию, состояние оборудования и доступность необходимых материалов. Параметры мойки задаются технологом, а не этим прототипом.'],['Во время процесса','Фиксируются номер партии, исполнитель, время операции и контрольные показатели по утверждённой форме. Отклонение создаёт задачу ответственному.'],['Проверка результата','Руководитель принимает результат, фиксирует причину потерь и при необходимости обновляет обучение смен.']]},haccp:{title:'Основы HACCP и санитарных стандартов',subtitle:'Пример учебного материала · не нормативная инструкция',sections:[['Цель обучения','Познакомить сотрудника с принятой в компании системой контроля безопасности продукции.'],['Программа','Изучить внутренние стандарты, контрольные точки, порядок ведения журналов и сообщения об отклонениях. Конкретные требования задаются утверждёнными документами компании.'],['Проверка знаний','Материалы → практическая демонстрация → экзамен наставнику → плановая переаттестация.']]},onboarding:{title:'Добро пожаловать в STARGRAD',subtitle:'Адаптация сотрудника · демонстрационный шаблон',sections:[['Первый день','Познакомиться с наставником, командой и целью своей роли. Получить доступ к материалам и рабочим процессам.'],['Первая неделя','Пройти вводный курс, изучить SOP подразделения и выполнить первые задачи под сопровождением наставника.'],['Первый результат','Обсудить прогресс с руководителем, подтвердить обязательные навыки и зафиксировать план дальнейшего обучения.']]},quality:{title:'Контроль качества партии',subtitle:'Пример журнала и процесса приёмки',sections:[['Карточка партии','Номер партии, сорт, ёмкость, объём, ответственный, текущий этап и история проверок.'],['Результаты контроля','Вносить фактические измерения и замечания по принятой методике. Параметры качества определяет технолог в утверждённой инструкции.'],['Действия по отклонению','Зафиксировать наблюдение, назначить ответственного, при необходимости ограничить дальнейшее движение партии до принятия решения.']]},accounting:{title:'Как читать управленческие показатели',subtitle:'Демонстрационная методика учёта',sections:[['План и факт','План — согласованный ориентир. Факт — результат за тот же период и по той же методике. Для расходов увеличение относительно плана не считается улучшением.'],['P&L и ДДС','P&L показывает доходы и расходы по начислению. ДДС — поступления и выплаты денег. Прибыль не обязана совпадать с изменением денежного остатка.'],['EBITDA','Демонстрационная операционная прибыль до процентов, налогов, износа и амортизации. Для внедрения состав показателя и исключения согласуются отдельно.'],['ФОТ и затраты на персонал','ФОТ и общие затраты на персонал — разные показатели. В общую сумму могут входить начисления, взносы и другие расходы по принятой методике.']]},roles:{title:'Должность, человек и учётная запись',subtitle:'Архитектура ответственности STARGRAD',sections:[['Должность','Содержит цель роли, ожидаемые результаты, показатели, процессы, полномочия и программу обучения.'],['Человек','Назначается на должность. История назначений сохраняется, даже если человек сменил роль или покинул компанию.'],['Учётная запись','Определяет права доступа в цифровой системе. При смене сотрудника новый человек получает согласованный шаблон прав, а прежние доступы должны быть пересмотрены.'],['ИИ-ассистент','Анализирует данные и предлагает действия в границах роли. Не отменяет ответственность человека за бизнес-решение.']]},service:{title:'Гостевой сервис STARGRAD',subtitle:'Учебный материал · пример',sections:[['Задача команды','Сделать визит гостя понятным, комфортным и достойным возвращения.'],['Сервис в деталях','Встреча, помощь с выбором, внимание к времени ожидания и обратной связи. Рекомендации должны помогать гостю, а не превращаться в навязчивую продажу.'],['Работа с обратной связью','Фиксировать замечания, передавать их ответственному и проверять, что причина устранена.']]}};let d=docs[id]||docs.sop;openModal({title:'База знаний',sub:'Документы доступны сотрудникам в рамках их роли.',wide:true,body:`<article class="doc-paper"><span class="tag amber">ДЕМО-МАТЕРИАЛ</span><h3>${d.title}</h3><p class="faint">${d.subtitle}</p>${d.sections.map(([t,p])=>`<h4>${t}</h4><p>${p}</p>`).join('')}<div class="separator"></div><p class="tiny faint">Этот текст иллюстрирует интерфейс и не заменяет утверждённый регламент, нормативные документы или обучение.</p></article>`,footer:'<button class="btn primary" data-action="close-modal">Готово</button>'})}
function purchaseModal(id=''){let item=INVENTORY.find(i=>i.id===id);openModal({title:'Заявка на закупку',sub:'Заявка попадёт в локальный список на согласование. Поставщику ничего не отправляется.',form:'purchase',body:`${field('Номенклатура',`<select class="select" name="item">${INVENTORY.map(i=>`<option value="${i.id}" ${i.id===id?'selected':''}>${i.name} · ${i.unit}</option>`).join('')}</select>`)}<div class="form-grid">${field('Количество',`<input class="input" name="quantity" type="number" min="0.1" max="1000000" step="0.1" value="${item?Math.max(item.min-item.stock,10):50}" required>`)}${field('Нужно к дате','<input class="input" type="date" name="date" value="2024-07-02" required>')}</div>${field('Комментарий','<textarea class="textarea" name="note" placeholder="Требования к поставке, уточнение цены..." maxlength="1000"></textarea>')}`,footer:`${cancelButton()}<button class="btn primary" type="submit">${icon('check','sm')}Передать на согласование</button>`})}
function inventoryDrawer(id){let i=INVENTORY.find(i=>i.id===id);if(!i)return;openDrawer(`${drawerHead('СКЛАД / '+i.category,i.name,'box')}<div class="drawer-value number">${num(i.stock,Number.isInteger(i.stock)?0:1)} <span style="font-size:23px">${i.unit}</span></div><div class="flex">${badge(`${i.days} дней запаса`,i.days<6?'red':'green')}${i.stock<i.min?badge('Ниже минимума','red'):badge('Запас в норме','green')}</div><div class="drawer-section"><div class="detail-pair"><span>Минимальный остаток</span><strong>${i.min} ${i.unit}</strong></div><div class="detail-pair"><span>Поставщик</span><strong>${i.supplier}</strong></div><div class="detail-pair"><span>Плановая цена за ${i.unit}</span><strong>${money(i.planPrice,1)}</strong></div><div class="detail-pair"><span>Последняя закупочная цена</span><strong class="${i.price>i.planPrice?'red':'green'}">${money(i.price,1)}</strong></div></div><div class="drawer-section"><div class="between"><h3>Закупочная цена</h3>${legend()}</div>${graph({kind:'units',height:190,style:'bar',values:[i.price*.94,i.price*.96,i.price*.99,i.price],plans:Array(4).fill(i.planPrice),labels:['Закупка 1','Закупка 2','Закупка 3','Последняя'],suffix:' ₽'})}</div><div class="drawer-ai"><h3 class="purple small">Рекомендация</h3><p>${i.stock<i.min?'Запас ниже минимального. Создайте заявку с учётом плановых варок и срока поставки.':i.price>i.planPrice?'Цена выше планового ориентира. Проверьте альтернативные предложения перед следующей закупкой.':'Остаток в рабочем диапазоне. Сохраняйте контроль срока годности и планового расхода.'}</p><button class="btn primary wide" data-action="purchase" data-id="${i.id}">${icon('plus','sm')}Создать заявку</button></div>`, 'inventory',id)}
function batchDrawer(id){let b=BATCHES.find(b=>b.id===id);if(!b)return;openDrawer(`${drawerHead('ПАСПОРТ ПАРТИИ / '+b.code,b.beer,'brewery')}<div class="flex mt20">${badge(b.tank)}${badge(b.stage,b.alert?'red':'green')}</div><div class="drawer-section"><div class="detail-pair"><span>Объём партии</span><strong>${num(b.volume)} л</strong></div><div class="detail-pair"><span>Текущая температура</span><strong>${num(b.temp,1)} °C</strong></div><div class="detail-pair"><span>Руководитель</span><strong>Иван Петров</strong></div><div class="detail-pair"><span>Готовность процесса</span><strong>${b.progress}%</strong></div>${miniProgress(b.progress,b.step===4?'green':'')}</div><div class="drawer-section"><h3>Движение партии</h3>${[['Варка',1],['Брожение',2],['Созревание',3],['Готовность к розливу',4]].map(([n,v])=>`<div class="action-row"><span class="icon-tile ${v<=b.step?'green':''}">${icon(v<=b.step?'checkCircle':'clock','sm')}</span><span class="grow small">${n}</span><span class="tiny faint">${v<b.step?'Пройден':v===b.step?'Текущий этап':'Впереди'}</span></div>`).join('')}</div>${b.alert?`<div class="drawer-ai" style="background:#fff0eb;border-color:#f0d2c5"><h3 class="red small">Датчик требует замены</h3><p style="color:#b78a7b">Температура в демонстрационном сценарии фиксируется вручную. Открыта задача техническому руководителю.</p><button class="btn danger wide" data-action="task-detail" data-id="13">Открыть задачу ${icon('arrow','sm')}</button></div>`:''}<button class="btn primary wide mt20" data-action="quality" data-id="${b.id}">${icon('flask','sm')}${state.qualityChecks.includes(b.id)?'Просмотреть проверку':'Принять контроль качества'}</button>`, 'batch',id)}
function qualityModal(id){let b=BATCHES.find(b=>b.id===id);if(!b)return;if(state.qualityChecks.includes(id)){openModal({title:'Проверка качества принята',sub:`${b.beer} · ${b.code}`,body:`<div class="flex"><span class="icon-tile green">${icon('checkCircle')}</span><div><h3>Демонстрационная проверка сохранена</h3><p class="tiny faint mt8">Ответственный — Иван Петров. Проверка внесена при просмотре прототипа.</p></div></div>`,footer:'<button class="btn primary" data-action="close-modal">Готово</button>'});return}openModal({title:'Контроль качества',sub:`${b.beer} · ${b.code}. Форма показывает процесс приёмки, а не реальные лабораторные результаты.`,form:'quality',id,body:`<div class="checklist">${['Карточка и маркировка партии сверены','Показатели проверены по утверждённой методике','Результат и замечания зафиксированы'].map((t,i)=>`<label class="check-item"><input type="checkbox" name="criterion${i}" required><span>${t}</span></label>`).join('')}</div>${field('Замечания','<textarea class="textarea mt16" name="note" placeholder="Комментарий к приёмке" maxlength="1000"></textarea>')}`,footer:`${cancelButton()}<button class="btn primary" type="submit">${icon('checkCircle','sm')}Принять проверку</button>`})}
function planBrewModal(){openModal({title:'Новая варка',sub:'Сохраните план выпуска. Запись появится в разделе пивоварни.',form:'brew',body:`${field('Сорт','<select class="select" name="name"><option>STARGRAD Lager</option><option>Amber Ale</option><option>Wheat Blanche</option><option>Citra IPA</option></select>')}<div class="form-grid">${field('Объём, л','<input class="input" type="number" name="volume" min="50" max="100000" step="50" value="1200" required>')}${field('Дата варки','<input class="input" type="date" name="date" value="2024-07-03" required>')}</div>${field('Ответственный',`<select class="select" name="owner">${personOptions('ivan')}</select>`)}`,footer:`${cancelButton()}<button class="btn primary" type="submit">Запланировать варку</button>`})}
function paymentModal(title='',value=0){if(title){openModal({title,sub:'Демонстрационная операция платёжного календаря',body:`<div class="scenario-output"><p class="small muted">${value>0?'Поступление':'Выплата'}</p><div class="number">${money(Math.abs(value))}</div><div class="mt16">${badge('Запланировано','amber')}</div></div><div class="detail-pair mt20"><span>Ответственный</span><strong>Ольга Кузнецова</strong></div><p class="tiny faint mt12">Прототип не выполняет платежи и не связан с банком.</p>`,footer:'<button class="btn primary" data-action="close-modal">Понятно</button>'});return}openModal({title:'Запланировать платёж',sub:'Добавить запись в локальный календарь. Без проведения банковской операции.',form:'payment',body:`${field('Назначение','<input class="input" name="name" required maxlength="140" placeholder="Например, поставка сырья">')}<div class="form-grid">${field('Сумма, ₽','<input class="input" type="number" name="amount" min="1" max="1000000000" value="100000" required>')}${field('Дата','<input class="input" type="date" name="date" value="2024-07-03" required>')}</div>`,footer:`${cancelButton()}<button class="btn primary" type="submit">Добавить в календарь</button>`})}
function integrationModal(id){const names={iiko:'Ресторанный учёт',oneC:'1С',telegram:'Telegram',loyalty:'Программа лояльности',bank:'Банк',mail:'Почта'};openModal({title:names[id]||'Интеграция',sub:'Настройка демонстрационного подключения. Не вводите настоящие пароли, токены или персональные данные.',form:'integration',id,body:`${field('Название подключения',`<input class="input" name="label" value="${names[id]} · тестовый контур" maxlength="100" required>`)}${field('Синхронизация','<select class="select" name="frequency"><option>Каждые 15 минут</option><option>Раз в час</option><option>Раз в день</option></select>')}<div class="drawer-ai"><div class="flex purple">${icon('info','sm')}<h3 class="small">Как это будет работать при внедрении</h3></div><p>${id==='oneC'?'Потребуется уточнить конфигурацию 1С, доступность обмена и участие профильного интегратора. Стоимость и способ интеграции согласуются отдельно.':'Проверяются возможности API или обмена файлами, состав данных, права доступа и частота обновления. Эта форма не создаёт реальное подключение.'}</p></div>`,footer:`${state.integrations[id]?`<button class="btn danger" type="button" data-action="disconnect" data-id="${id}">Отключить в демо</button>`:cancelButton()}<button class="btn primary" type="submit">${icon('plug','sm')}Сохранить в демо</button>`})}
function campaignModal(id){let details={terrace:['Летняя терраса',1240,186,284000],birthday:['День рождения в STARGRAD',320,64,126000],return:['Давно не виделись',860,93,149000]},d=details[id];if(!d)return;openModal({title:d[0],sub:'Результаты демонстрационной кампании за июнь',wide:true,body:`<div class="task-stats" style="grid-template-columns:repeat(3,1fr)">${statCard('Получателей',num(d[1]),'users','Размер аудитории')}${statCard('Визитов',num(d[2]),'heart',percent(d[2]/d[1]*100,1)+' от аудитории')}${statCard('Выручка',money(d[3]),'chart','По связанной аудитории')}</div><p class="small muted" style="line-height:1.9">В рабочей системе атрибуция визитов и выручки должна быть согласована с программой лояльности и источниками данных. Эти результаты иллюстрируют интерфейс, а не доказывают эффективность кампании.</p><div class="drawer-ai"><h3 class="small purple">Следующий шаг</h3><p>Сравнить результат с контрольным периодом, оценить повторные визиты и подготовить следующую кампанию.</p></div>`,footer:`<button class="btn" data-action="close-modal">Закрыть</button><button class="btn ai" data-action="ai-task" data-id="guests">Создать задачу маркетингу</button>`})}
function segmentModal(id){let names={regular:'Постоянные гости',new:'Новые гости',sleeping:'Давно не были',vip:'Высокий средний чек'};openModal({title:names[id],sub:'Демонстрационный сегмент аудитории. Реальные контактные данные отсутствуют.',body:`<div class="flex"><span class="icon-tile lg">${icon('users','lg')}</span><div><h3>Критерии сегмента</h3><p class="small muted mt8">${id==='regular'?'Три и более визита за последние 90 дней.':id==='new'?'Первый визит в течение последних 30 дней.':id==='sleeping'?'Более 60 дней с последнего визита.':'Средний чек выше 3 000 ₽.'}</p></div></div><div class="drawer-ai"><h3 class="small purple">Рекомендация</h3><p>${id==='sleeping'?'Начать с мягкого приглашения и конкретного повода вернуться, а не с массовой скидки.':id==='vip'?'Использовать персональные приглашения на дегустации и специальные мероприятия.':'Подготовить релевантный повод для следующего визита и проверить результат по фактическим посещениям.'}</p></div>`,footer:`${cancelButton()}<button class="btn primary" data-action="new-campaign" data-segment="${id}">Создать черновик кампании</button>`})}

function sendChat(text){text=String(text||'').trim();if(!text)return;if(text.length>1000)text=text.slice(0,1000);chatMessages.push({user:true,text});let log=qs('#chatLog');if(!log)return;log.innerHTML=chatMessages.map(chatMessageHTML).join('')+`<div class="chat-message" id="chatTyping">${loadingDots()}</div>`;log.scrollTop=log.scrollHeight;let lower=text.toLowerCase();setTimeout(()=>{let reply;if(/фот|персонал|смен|сверхур/.test(lower))reply={html:'<strong>ФОТ выше бюджета на 140 000 ₽.</strong><br>Предлагаю сверить сверхурочные с загрузкой вечерних смен и скорректировать график. Ответственная — Анна Смирнова.',action:'payroll'};else if(/пив|потер|варк/.test(lower))reply={html:'<strong>Потери пива — 2,8% при плане 3,5%.</strong><br>Закрепим результат: обновим регламент мойки и передадим практику всем сменам. Ответственный — Иван Петров.',action:'beerLoss'};else if(/деньг|касс|плат|остат/.test(lower))reply={html:'<strong>Денежные средства — '+money(metricNumbers(metric('cash')).v)+'.</strong><br>В ближайшем календаре: продукты, аренда и предоплата банкета. Предлагаю сверить платёжный план на неделю.',action:'cash'};else if(/план|действ|вниман|закуп|цен|проблем|отклон/.test(lower))reply={html:'<strong>Начнём с закупочных цен.</strong><br>Отклонение 4,1% при ориентире 3%. Дмитрию стоит сравнить предложения по мясу и таре.<br><br>Следом — сверхурочные смен и датчик температуры в ЦКТ-3.',action:'purchaseVariance'};else if(/прогноз|следующ|июл/.test(lower))reply={html:'<strong>Базовый прогноз — 13,2 млн ₽.</strong><br>В разделе «Финансы → Сценарии» можно проверить, как изменение гостей, чека и себестоимости повлияет на результат.',action:'forecast'};else if(/обуч|курс|экзам/.test(lower))reply={html:'<strong>Готово к приёму экзаменов: '+pendingExams()+'.</strong><br>Откройте «Обучение»: у каждого завершённого курса есть своя кнопка «Принять экзамен». Ближайшая переаттестация — через 7 дней.'};else if(/привет|здравств/.test(lower))reply={html:'Алексей, добрый день. <strong>Бизнес под контролем.</strong><br>Посмотрим на прибыль, закупки, пивоварню или задачи команды? В этом прототипе я отвечаю по нескольким демонстрационным сценариям.'};else reply={html:'В этом прототипе я показываю <strong>сценарную работу ИИ-аналитика</strong>, а не анализирую произвольные данные.<br><br>Попробуйте спросить о закупочных ценах, ФОТ, потерях пива, деньгах, обучении или плане действий.'};chatMessages.push(reply);if(qs('#chatLog')){qs('#chatLog').innerHTML=chatMessages.map(chatMessageHTML).join('');qs('#chatLog').scrollTop=qs('#chatLog').scrollHeight}},850)}
function csvSafe(v){let s=String(v??'');if(typeof v==='string'&&/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}

function exportData(kind){let rows;if(kind==='inventory'){rows=[['Номенклатура','Категория','Остаток','Ед.','Минимум','Плановая цена','Фактическая цена','Поставщик'],...INVENTORY.map(i=>[i.name,i.category,i.stock,i.unit,i.min,i.planPrice,i.price,i.supplier])]}else if(kind==='finance'&&subroute==='budgets'){rows=[['Бюджет','Подразделение','План','Факт','Ответственный'],...state.budgets.map(b=>[b.name,b.dept,b.plan,b.spent,person(b.owner).name])]}else if(kind==='finance'&&subroute==='pnl'){rows=[['Статья','План','Факт','Отклонение'],...pnlRows().map(r=>[r.name,r.p,r.v,r.v-r.p])]}else if(kind==='finance'&&subroute==='cash'){const end=metricNumbers(metric('cash')).v;rows=[['Показатель','Сумма, ₽'],['На начало периода',3650000],['Поступления',15420000],['Выплаты',3650000+15420000-end],['На конец периода',end]]}else{rows=[['Показатель','План','Факт','Отклонение','Ответственный','Период'],...METRICS.map(m=>{let {v,p}=metricNumbers(m);return[m.label,p,v,v-p,person(m.owner).role,MONTHS[state.month]]})]}downloadText('\uFEFF'+rows.map(r=>r.map(csvSafe).join(';')).join('\r\n'),'STARGRAD_'+kind+'_'+['2024-05','2024-06','2024-07'][state.month]+'.csv','text/csv;charset=utf-8');toast('CSV с демонстрационными данными подготовлен')}

case 'fullscreen':closePopover();try{if(document.fullscreenElement){await document.exitFullscreen();state.presentation=false}else{await document.documentElement.requestFullscreen();state.presentation=true}save();applySettings()}catch(err){toast('Для полноэкранного показа используйте F11 в браузере')}break;
case 'search':openSearch();break;

case 'retake-course':{const l=getLearn(el.dataset.person),index=+el.dataset.course;l.progress[index]=85;l.approved[index]=false;save();closeModal();render();toast('Курс возвращён на доработку');break;}

case 'remind-learning':openModal({title:'Напомнить об обучении',sub:'Локальная демонстрация напоминания. Внешние сообщения не отправляются.',body:`<p class="small muted">Напоминание будет отмечено в демо для ${state.learners.filter(l=>l.progress.some(v=>v<100)).length} сотрудников с незавершёнными курсами.</p>`,footer:`${cancelButton()}<button class="btn primary" data-action="confirm-remind">Подтвердить в демо</button>`});break;

document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();if(!form.checkValidity()){form.reportValidity();return}const data=Object.fromEntries(new FormData(form)),type=form.dataset.form,id=form.dataset.id;switch(type){
case 'chat':{let input=qs('input',form);sendChat(data.message);input.value='';input.focus();return;}
case 'new-task':{const t={id:Date.now(),title:data.title.trim(),description:data.description.trim(),owner:data.owner,status:data.status,source:data.status==='ai'?'ИИ':'Ручная',due:data.due,priority:data.priority,check:[false,false,false]};if(!t.title||!t.description)return;state.tasks.unshift(t);save();closeModal(false);navigate('tasks');toast('Задача создана и назначена ответственному','Открыть','task-detail',t.id);break;}
case 'task-comment':{state.taskComments[id]??=[];state.taskComments[id].push({text:data.text.trim(),time:'Добавлено в демо'});save();taskDrawer(id,true);toast('Комментарий добавлен');break;}
case 'person-message':{state.checkNotes['messages-'+id]??=[];state.checkNotes['messages-'+id].push(data.message.trim());save();messageModal(id);toast('Сообщение добавлено в локальный диалог');break;}
case 'exam':{let l=getLearn(data.person),i=+data.course;l.approved[i]=true;state.checkNotes['exam-'+data.person+'-'+i]=data.comment;save();closeModal();render();celebrate();toast(`Экзамен принят: ${person(data.person).name} · ${COURSES[i].name}`);break;}
case 'assign-course':{let l=getLearn(data.person),i=+data.course;if(!l){l={id:data.person,progress:[0,0,0,0,0],approved:[false,false,false,false,false]};state.learners.push(l)}l.progress[i]=0;l.approved[i]=false;state.tasks.unshift({id:Date.now(),title:'Пройти курс «'+COURSES[i].name+'»',description:'Изучить материалы и пройти проверку знаний у наставника.',owner:data.person,status:'todo',source:'Регламент',priority:'normal',due:data.due,check:[false,false,false]});save();closeModal();learningTab='courses';render();toast('Курс назначен. Задача добавлена в Kanban.');break;}
case 'meeting':state.meetings.push({...data,id:Date.now()});save();closeModal();render();toast('Встреча сохранена в демонстрационном календаре');break;
case 'recert':state.requests.push({type:'recert',id:Date.now(),...data});state.tasks.unshift({id:Date.now()+1,title:'Переаттестация: '+data.course,description:'Подготовиться к проверке знаний с наставником '+data.mentor+'.',owner:data.person,status:'todo',source:'Регламент',priority:'normal',due:data.date,check:[false,false,false]});save();closeModal();render();toast('Переаттестация назначена. Задача создана.','К задачам','nav','tasks');break;
case 'budget':{let p=+data.plan,spent=+(data.spent||0);if(!Number.isFinite(p)||p<=0)return;let b=id?state.budgets.find(b=>b.id===+id):null;if(b){Object.assign(b,{name:data.name.trim(),plan:p,spent,dept:data.dept,owner:data.owner,status:spent>p?'Требует внимания':'Утверждён'})}else{state.budgets.push({id:Date.now(),name:data.name.trim(),plan:p,spent:0,dept:data.dept,owner:data.owner,status:'Черновик'})}save();closeModal(false);navigate('finance/budgets');toast(id?'Бюджет обновлён, план-факт пересчитан':'Новый план добавлен в бюджеты');break;}
case 'edit-role':state.checkNotes['goal-'+id]=data.goal.trim();save();closeModal();render();toast('Цель роли обновлена');break;
case 'reassign':{let old=roleEmployee(id);state.assignments[id]=data.person;state.assignmentHistory.push({role:id,from:old,to:data.person,date:'30 июня 2024 · демо'});let l=getLearn(data.person);if(!l){l={id:data.person,progress:[0,0,0,0,0],approved:[false,false,false,false,false]};state.learners.push(l)}l.progress[2]=0;l.approved[2]=false;state.tasks.unshift({id:Date.now(),title:'Адаптация к роли: '+roleById(id).name,description:'Получить доступы по роли, изучить регламенты подразделения и согласовать первые результаты с руководителем.',owner:data.person,status:'todo',source:'Регламент',priority:'normal',due:'2024-07-07',check:[false,false,false]});save();closeModal();render();celebrate();toast('Сотрудник назначен. Доступы по роли и обучение подготовлены.');break;}
case 'purchase':{let i=INVENTORY.find(i=>i.id===data.item);state.requests.push({id:Date.now(),type:'purchase',name:i.name,value:+data.quantity,date:data.date,note:data.note});save();closeModal(false);navigate('inventory');toast('Заявка добавлена на согласование. Поставщик не уведомлялся.');break;}
case 'quality':state.qualityChecks.push(id);state.checkNotes['quality-'+id]=data.note;save();closeModal();render();if(drawerState?.type==='batch')batchDrawer(id);toast('Проверка качества сохранена в карточке партии');break;
case 'brew':state.requests.push({id:Date.now(),type:'brew',name:data.name,value:+data.volume,date:data.date,owner:data.owner});save();closeModal(false);navigate('brewery');toast('Варка добавлена в производственный план');break;
case 'payment':state.requests.push({id:Date.now(),type:'payment',name:data.name,value:+data.amount,date:data.date});save();closeModal(false);navigate('finance/cash');toast('Платёж добавлен в демо-календарь. Деньги не списывались.');break;
case 'integration':state.integrations[id]=true;state.checkNotes['integration-'+id]={label:data.label,frequency:data.frequency};save();closeModal();render();toast('Демонстрационное подключение сохранено');break;
case 'campaign':state.requests.push({id:Date.now(),type:'campaign',name:data.name,note:data.note,segment:data.segment,date:'30 июня 2024'});save();closeModal(false);navigate('guests');toast('Черновик кампании сохранён. Рассылка не запускалась.');break;
case 'person':{let role=roleById(data.role),p={id:'new'+Date.now(),name:data.name.trim(),role:data.positionName.trim(),dept:role.dept,position:data.role,email:'',photo:null};state.peopleExtras??=[];state.peopleExtras.push(p);PEOPLE.push(p);if(data.onboard)state.learners.push({id:p.id,progress:[0,0,0,0,0],approved:[false,false,false,false,false]});save();closeModal(false);navigate('people');toast('Демонстрационная карточка сотрудника добавлена');break;}
}});

document.addEventListener('change',e=>{const el=e.target,a=el.dataset.change,id=el.dataset.id;if(!a)return;switch(a){
case 'task-owner':taskFilter.owner=el.value;render();break;
case 'task-source':taskFilter.source=el.value;render();break;
case 'task-overdue':taskFilter.overdue=el.checked;render();break;
case 'task-status':moveTask(id,el.value);break;
case 'task-assignee':{const t=state.tasks.find(t=>t.id===+id);t.owner=el.value;save();render();taskDrawer(id,true);toast('Ответственный изменён');break;}
case 'task-due':{if(!el.value)return;const t=state.tasks.find(t=>t.id===+id);t.due=el.value;save();render();taskDrawer(id,true);toast('Срок задачи обновлён');break;}
case 'task-check':{const t=state.tasks.find(t=>t.id===+id);t.check[+el.dataset.index]=el.checked;save();render();taskDrawer(id,true);break;}
case 'learn-dept':learnFilter.dept=el.value;render();break;
case 'learn-status':learnFilter.status=el.value;render();break;
case 'motion':state.motion=el.checked;save();applySettings();toast(state.motion?'Микроанимации включены':'Микроанимации выключены');break;
case 'compact':state.compact=el.checked;save();applySettings();toast(state.compact?'Компактная плотность включена':'Стандартная плотность включена');break;
case 'notify':state.notify=el.checked;save();if(state.notify)toast('Уведомления включены');break;
}});

document.addEventListener('input',e=>{const el=e.target;if(el.id==='globalSearch'){renderSearchResults(el.value);return}if(el.dataset.input==='people-search'){peopleQuery=el.value;qs('#peopleGrid').innerHTML=peopleCards(PEOPLE.filter(p=>(p.name+' '+p.role+' '+p.dept).toLowerCase().includes(peopleQuery.toLowerCase())));return}if(el.dataset.range){scenario[el.dataset.range]=+el.value;qs('#range-'+el.dataset.range+'-value').textContent=(+el.value>0?'+':'')+el.value+' '+(el.dataset.range==='cost'?'п.п.':'%');qs('#scenario-output').innerHTML=scenarioOutput()}});

document.addEventListener('pointermove',e=>{let k=e.target.closest('.kpi');if(k){let r=k.getBoundingClientRect();k.style.setProperty('--mx',e.clientX-r.left+'px');k.style.setProperty('--my',e.clientY-r.top+'px')}const chart=e.target.closest('[data-chart]'),simple=e.target.closest('[data-tip]');let target=chart||simple;if(!target){if(lastHover)hideTooltip();return}const tip=qs('#tooltip');if(lastHover!==target){lastHover=target;if(chart){tip.className='tooltip chart-tip';tip.innerHTML=`<strong>${esc(chart.dataset.label)}</strong><div class="tip-row"><span class="flex gap6"><i class="legend-dot plan"></i>План</span><b>${esc(chart.dataset.plan)}</b></div><div class="tip-row"><span class="flex gap6"><i class="legend-dot"></i>Факт</span><b>${esc(chart.dataset.fact)}</b></div>`;const svg=chart.closest('svg'),line=qs('.chart-hover-line',svg),dot=qs('.chart-hotdot',svg);line.setAttribute('x1',chart.dataset.x);line.setAttribute('x2',chart.dataset.x);dot.setAttribute('cx',chart.dataset.x);dot.setAttribute('cy',chart.dataset.y);line.style.opacity='1';dot.style.opacity='1'}else{tip.className='tooltip';tip.textContent=simple.dataset.tip}tip.classList.add('show')}positionTooltip(e,target)});
document.addEventListener('pointerout',e=>{if(!e.relatedTarget)hideTooltip()});
document.addEventListener('focusin',e=>{let el=e.target;if(el.matches('[data-chart]')){const r=el.getBoundingClientRect();el.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,clientX:r.left+r.width/2,clientY:r.top+40}))}});
document.addEventListener('focusout',e=>{if(e.target.matches('[data-chart]'))hideTooltip()});
window.addEventListener('scroll',hideTooltip,{passive:true});
window.addEventListener('resize',()=>{hideTooltip();closePopover();if(tourStep>=0){clearTimeout(window._tourResize);window._tourResize=setTimeout(showTourStep,200)}});
let draggingId=null;
document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-task]');if(!card)return;draggingId=+card.dataset.task;e.dataTransfer.setData('text/plain',String(draggingId));e.dataTransfer.effectAllowed='move';hideTooltip();setTimeout(()=>card.classList.add('dragging'),0)});
document.addEventListener('dragover',e=>{const col=e.target.closest('.kanban-col');if(!col||!draggingId)return;e.preventDefault();e.dataTransfer.dropEffect='move';qsa('.kanban-col.drag-over').forEach(x=>{if(x!==col)x.classList.remove('drag-over')});col.classList.add('drag-over')});
document.addEventListener('dragleave',e=>{const col=e.target.closest('.kanban-col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drag-over')});
document.addEventListener('drop',e=>{const col=e.target.closest('.kanban-col');if(!col||!draggingId)return;e.preventDefault();const id=+e.dataTransfer.getData('text/plain');moveTask(id,col.dataset.status,true);draggingId=null;qsa('.drag-over,.dragging').forEach(el=>el.classList.remove('drag-over','dragging'))});
document.addEventListener('dragend',()=>{draggingId=null;qsa('.dragging,.drag-over').forEach(el=>el.classList.remove('dragging','drag-over'))});

document.addEventListener('keydown',e=>{const input=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'||e.key==='/'&&!input){e.preventDefault();openSearch();return}if(e.key==='Escape'){hideTooltip();if(qs('.popover'))closePopover(true);else if(qs('.modal-overlay'))closeModal();else if(qs('.drawer'))closeDrawer();else if(tourStep>=0)endTour();else{qs('#sidebar').classList.remove('open');qs('#mobileBackdrop').classList.remove('show')}return}if(e.target.matches('[data-chart]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const hits=qsa('[data-chart]',e.target.closest('svg')),i=hits.indexOf(e.target),j=Math.max(0,Math.min(hits.length-1,i+(e.key==='ArrowRight'?1:-1)));hits[j].focus();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.task-card')){e.preventDefault();taskDrawer(e.target.dataset.id);return}if(e.key==='Tab'){const dialog=qs('.modal-overlay .modal')||qs('.drawer');if(dialog){const focusables=qsa('button:not([disabled]),input:not([type=hidden]),select,textarea,a[href],[tabindex="0"]',dialog).filter(el=>el.offsetParent!==null);if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===dialog)){e.preventDefault();first.focus()}}}});
qs('#mobileBackdrop').addEventListener('click',()=>{qs('#sidebar').classList.remove('open');qs('#mobileBackdrop').classList.remove('show')});
window.addEventListener('hashchange',()=>{closePopover();closeDrawer(false);closeModal(false);hideTooltip();readRoute();render();window.scrollTo({top:0,behavior:'instant'})});
(state.peopleExtras||[]).forEach(p=>{if(!PEOPLE.some(x=>x.id===p.id))PEOPLE.push(p)});
readRoute();render();
